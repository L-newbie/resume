name: Deploy to GitHub Pages

# 推送到 main / master 自动构建并发布；也可在 Actions 页手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
    build:
    runs-on: ubuntu-latest
    # 👇 设置默认在 resume 目录下执行后续所有 run 命令
    defaults:
      run:
        working-directory: ./resume
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # 👇 显式指定子目录下的 lock 文件用于缓存控制
          cache-dependency-path: './resume/package-lock.json'
      - run: npm ci
      - run: npm run build
      - run: npm test # 构建产物检查，失败则不部署
      - uses: actions/upload-pages-artifact@v3
        with:
          # 👇 确保打包产物的路径正确（如果在子目录下，一般是 resume/dist）
          path: resume/dist


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
